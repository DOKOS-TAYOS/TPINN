[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tnpinn"
version = "0.1.0"
description = "Physics-informed neural networks based on tensor networks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "tensorkrowch",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
tnpinn = "tnpinn.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"

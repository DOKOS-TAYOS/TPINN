seed: 1234
device: auto
dtype: float64

problem:
  name: heat2d_transient
  alpha: 0.1
  t_final: 1.0
  domain:
    x: [0.0, 1.0]
    y: [0.0, 1.0]
    t: [0.0, 1.0]
  boundary:
    left: sin_pi_y
    right: zero
    bottom: zero
    top: zero
  initial:
    kind: zero
  use_hard_constraints: false

model:
  family: tensor_network
  baseline: null
  output_dim: 1

  feature_map:
    kind: fourier_sites
    site_dim: 2
    n_sites_per_coord:
      x: 8
      y: 8
      t: 8
    frequency_scale: 3.141592653589793
    frequency_mode: powers_of_two
    trainable_frequencies: false
    include_identity_site: false

  tensor_network:
    backend: tensorkrowch_nodes
    architecture: coordinate_branch_mps
    bond_dim: 8
    branch_factor: 2
    share_blocks: false
    init_std: 0.05
    normalize_cores: false

training:
  optimizer: adam
  lr: 1.0e-3
  steps: 30000
  n_collocation: 4096
  n_boundary: 1024
  n_initial: 1024
  resample_every: 10
  grad_clip: 10.0
  lbfgs_after_adam: false

loss:
  residual: 1.0
  boundary: 10.0
  initial: 10.0
  data: 0.0
  regularization: 1.0e-8

eval:
  grid_size: 80
  eval_every: 500
  save_figures_every: 1000
  eval_times: [0.0, 0.25, 0.5, 1.0]

output:
  root_dir: runs
  save_checkpoints: true
  save_predictions: true
  save_figures: true

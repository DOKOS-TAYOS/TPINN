seed: 1234
device: auto
dtype: float64

problem:
  name: helmholtz_antenna2d
  k: 6.283185307179586
  source_sigma: 0.1
  boundary_condition: dirichlet_zero
  domain:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]

model:
  family: tensor_network
  baseline: null
  output_dim: 2

  feature_map:
    kind: fourier_sites
    site_dim: 2
    n_sites_per_coord:
      x: 12
      y: 12
    frequency_scale: 3.141592653589793
    frequency_mode: linear
    trainable_frequencies: false
    include_identity_site: false

  tensor_network:
    backend: tensorkrowch_hybrid
    architecture: coordinate_branch_mps
    bond_dim: 12
    branch_factor: 2
    share_blocks: false
    init_std: 0.03
    normalize_cores: false

training:
  optimizer: adam
  lr: 5.0e-4
  steps: 40000
  n_collocation: 8192
  n_boundary: 2048
  n_initial: 0
  resample_every: 10
  grad_clip: 10.0
  lbfgs_after_adam: false

loss:
  residual: 1.0
  boundary: 10.0
  initial: 0.0
  data: 0.0
  regularization: 1.0e-8

eval:
  grid_size: 128
  eval_every: 500
  save_figures_every: 1000

output:
  root_dir: runs
  save_checkpoints: true
  save_predictions: true
  save_figures: true

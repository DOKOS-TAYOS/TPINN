seed: 1234
device: auto
dtype: float64

problem:
  name: lorenz
  sigma: 10.0
  rho: 28.0
  beta: 2.6666666666666665
  t_final: 4.0
  initial_state: [1.0, 1.0, 1.0]
  domain:
    t: [0.0, 4.0]

model:
  family: tensor_network
  baseline: null
  output_dim: 3

  feature_map:
    kind: fourier_sites
    site_dim: 2
    n_sites_per_coord:
      t: 16
    frequency_scale: 3.141592653589793
    frequency_mode: powers_of_two
    trainable_frequencies: false
    include_identity_site: true

  tensor_network:
    backend: tensorkrowch_hybrid
    architecture: global_mps
    bond_dim: 8
    branch_factor: 2
    share_blocks: false
    init_std: 0.05
    normalize_cores: false

training:
  optimizer: adam
  lr: 1.0e-3
  steps: 20000
  n_collocation: 2048
  n_boundary: 0
  n_initial: 1
  resample_every: 10
  grad_clip: 10.0
  lbfgs_after_adam: false

loss:
  residual: 1.0
  boundary: 0.0
  initial: 100.0
  data: 0.0
  regularization: 1.0e-8

eval:
  grid_size: 2000
  eval_every: 500
  save_figures_every: 1000

output:
  root_dir: runs
  save_checkpoints: true
  save_predictions: true
  save_figures: true
